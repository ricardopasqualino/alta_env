<main id="main" class="main">

<script>
    // Verificar se Chart.js está disponível
    console.log('Chart.js disponível:', typeof Chart !== 'undefined');
    
    // Dados do preço médio mensal
    const dadosFicticios = {
        labels: [
            {% for item in preco_medio_mensal %}
                '{{ item.mes }}/{{ item.ano }}'{% if not forloop.last %},{% endif %}
            {% endfor %}
        ],
        datasets: [{
            label: 'Preço de Revenda (R$)',
            data: [
                {% for item in preco_medio_mensal %}
                    {{ item.preco_medio|floatformat:2 }}{% if not forloop.last %},{% endif %}
                {% endfor %}
            ],
            backgroundColor: 'rgba(54, 162, 235, 0.8)',
            borderColor: 'rgba(54, 162, 235, 1)',
            borderWidth: 1
        }]
    };

    async function fetchPrecoRevenda() {
        // Simulando uma chamada de API
        return new Promise((resolve) => {
            setTimeout(() => {
                resolve(dadosFicticios);
            }, 100);
        });
    }

    async function TotalPrecoRevenda() {
        try {
            console.log('Iniciando carregamento do gráfico...');
            const data = await fetchPrecoRevenda();
            console.log('Dados carregados:', data);
            
            const canvas = document.getElementById('TotalPrecoRevenda');
            console.log('Canvas encontrado:', canvas);
            
            if (!canvas) {
                console.error('Canvas não encontrado');
                return;
            }

            const ctx = canvas.getContext('2d');
            console.log('Contexto 2D obtido:', ctx);
            
            // Verificar se Chart está disponível
            if (typeof Chart === 'undefined') {
                console.error('Chart.js não está carregado');
                return;
            }

            const chart = new Chart(ctx, {
                type: 'bar',
                data: data,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return 'Preço: R$ ' + context.parsed.y.toFixed(2);
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Preço (R$)'
                            },
                            ticks: {
                                callback: function(value) {
                                    return 'R$ ' + value.toFixed(2);
                                }
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Mês'
                            }
                        }
                    },
                    animation: {
                        duration: 1000
                    }
                }
            });
            
            console.log('Gráfico criado com sucesso:', chart);
        } catch (error) {
            console.error('Erro ao carregar o gráfico:', error);
        }
    }

    // Função para tentar carregar o gráfico
    function tentarCarregarGrafico() {
        if (typeof Chart !== 'undefined' && document.getElementById('TotalPrecoRevenda')) {
            console.log('Tentando carregar gráfico...');
            TotalPrecoRevenda();
        } else {
            console.log('Chart.js ou canvas não disponível, tentando novamente em 100ms...');
            setTimeout(tentarCarregarGrafico, 100);
        }
    }

    // Carregar o gráfico quando a página estiver pronta
    document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM carregado, iniciando gráfico...');
        tentarCarregarGrafico();
    });

    // Fallback: tentar carregar após um pequeno delay
    setTimeout(function() {
        console.log('Fallback: verificando se pode carregar o gráfico...');
        tentarCarregarGrafico();
    }, 1000);
</script>
