{% extends 'base.html' %}

{% load static %}

{% block main %}

<main id="main" class="main">

    <div class="pagetitle mb-3">
        <h1>Monitorar produtos</h1>
    </div>
    
    <div class="row">
        <form method="GET" id="filtroForm">
            <div class="row">    
                <div class="col-lg-2 col-sm-12 col-md-6">
                    <div class="input-group date mt-2" data-provide="datepicker">
                        <input type="text" class="form-control" placeholder="Início" 
                        name="data_inicio" 
                        value="{{ request.GET.data_inicio|default:'' }}" />
                        <span class="input-group-append m-1">
                            <span class="input-group-text">
                                <i class="fa fa-calendar"></i>
                            </span>
                        </span>                
                    </div>
                </div>
            

                <div class="col-lg-2 col-sm-12 col-md-6">
                    <div class="input-group date mt-2" data-provide="datepicker">
                        <input type="text" class="form-control" placeholder="Fim"
                        name="data_fim" value="{{ request.GET.data_fim|default:'' }}" />
                        <span class="input-group-append m-1">
                            <span class="input-group-text">
                                <i class="fa fa-calendar"></i>
                            </span>
                        </span>                
                    </div>
                </div> 

                <div class="col-lg-3 col-sm-12 col-md-4 mt-2">
                    <div class="form-group">
                        <select class="form-select" id="produto" name="produto"
                            {{ filter.form.produto }} </>
                    </div>
                </div>
                
                <div class="col-lg-2 d-none d-lg-block">
                    <button class="btn btn-primary m-1" type="submit">Filtrar</button>
                </div>      

                <div class="col-lg-2 d-lg-none mt-2">
                    <button class="btn btn-primary m-1 w-100" type="submit">Filtrar</button>
                </div>        
   

                <div class="col-lg-2 d-lg-none">
            </div>
        </form>
    </div>

    <div class="row mb-3">
        <p class="mb-0 mt-3 text-muted small">Dados exibidos para a cidade de
        <a href="{% url 'p_profile' %}" class="breadcrumb-item">{{ cidade_usuario }}/{{ uf_usuario }}</a></p>
    </div>


<section class="section contact">
    
    <div class="row d-flex d-none d-lg-flex">
        <div class="col-lg-2">
            <div class="info-box card">
                <p class="text-muted mb-1">Total de</p>
                <h4 class="text-muted"><strong>{{ total_linhas_pesquisa }}</strong></h4>
                <p>preços em {{ total_postos }} postos</p>
            </div>
        </div>
    
        <div class="col-lg-2">
            <div class="info-box card">
                <p class="text-muted mb-1">Menor preço</p>
                <h4 class="text-success"><strong>R$ {{ menor_preco|floatformat:2 }}</strong></h4>
                <p><span class="badge bg-info text-white p-2">{{ menor_preco_count }}</span>  <span class="text-muted small">   {{ data_menor_preco|date:'d/m/Y' }}</span></p>
            </div>
        </div>

        <div class="col-lg-2">
            <div class="info-box card">
                <p class="text-muted mb-1">Preço Médio</p>
                <h4 class="text-primary"><strong>R$ {{ media_preco|floatformat:2 }}</strong></h4>
                <p>{{ today|date:'d/m/Y' }}</p>
            </div>
        </div>

        <div class="col-lg-2">
            <div class="info-box card">
                <p class="text-muted mb-1">Maior Preço</p>
                <h4 class="text-danger"><strong>R$ {{ maior_preco|floatformat:2 }}</strong></h4>
                <p><span class="badge bg-info text-white p-2">{{ maior_preco_count }}</span><span class="text-muted small">  {{ data_maior_preco|date:'d/m/Y' }}</span></p>
            </div> 
        </div> 

        <div class="col-lg-2">
            <div class="info-box card">
                <p class="text-muted mb-1">R$ Variação</p>
                <h4 class="text-danger"><strong>R$ {{ variance|floatformat:2 }}</strong></h4>
            </div>
        </div>           

        <div class="col-lg-2">
            <div class="info-box card">
                <p class="text-muted mb-1">% Variação</p>
                <h4 class="text-danger"><strong>{{ variance_percent|floatformat:2 }}%</strong></h4>
            </div>
        </div>

   
    </div>

    <div class="row d-flex d-md-none">
        <div class="col-6">
            <div class="info-box card">
                <p class="text-muted mb-1">Total de</p>
                <h4 class="text-muted"><strong>{{ total_linhas_pesquisa }} preços</strong></h4>
                <p><span class="badge bg-info text-white p-2">{{ total_postos }}</span> postos</p>
            </div>
        </div>
    
        <div class="col-6">
            <div class="info-box card">
                <p class="text-muted mb-1">Menor preço</p>
                <h4 class="text-success"><strong>R$ {{ menor_preco|floatformat:2 }}</strong></h4>
                <p><span class="badge bg-info text-white p-2">{{ menor_preco_count }}</span>  <span class="text-muted small">   {{ data_menor_preco|date:'d/m/Y' }}</span></p>
            </div>
        </div>

        <div class="col-6">
            <div class="info-box card">
                <p class="text-muted mb-1">Preço Médio</p>
                <h4 class="text-primary"><strong>R$ {{ media_preco|floatformat:2 }}</strong></h4>
                <p>{{ today|date:'d/m/Y' }}</p>
            </div>
        </div>

        <div class="col-6">
            <div class="info-box card">
                <p class="text-muted mb-1">Maior Preço</p>
                <h4 class="text-danger"><strong>R$ {{ maior_preco|floatformat:2 }}</strong></h4>
                <p><span class="badge bg-info text-white p-2">{{ maior_preco_count }}</span><span class="text-muted small">  {{ data_maior_preco|date:'d/m/Y' }}</span></p>
            </div> 
        </div> 

        <div class="col-6">
            <div class="info-box card">
                <p class="text-muted mb-1">R$ Variação</p>
                <h4 class="text-danger"><strong>R$ {{ variance|floatformat:2 }}</strong></h4>
            </div>
        </div>           

        <div class="col-6">
            <div class="info-box card">
                <p class="text-muted mb-1">% Variação</p>
                <h4 class="text-danger"><strong>{{ variance_percent|floatformat:2 }}%</strong></h4>
            </div>
        </div>   
    </div>

    <div class="row">
        <div class="col-lg-4 col-sm-12 col-md-6">
            <div class="card">
                <div class="row gy-4">
                    <div class="col-lg-12 info-box">
                        <h3 class="m-3">Preço médio MENSAL</h3>
                        <div class="col-lg-12 col-sm-12 p-3">
                            <div style="position: relative; height: 400px; width: 100%;">
                                <canvas id="TotalPrecoRevenda" style="width: 100%; height: 100%;"></canvas>
                            </div>
                        </div>   
                    </div>
                </div>                    
            </div>  
        </div>  
        <div class="col-lg-4 col-sm-12 col-md-6">
            <div class="card">
                <div class="row gy-4">
                    <div class="col-lg-12 info-box">
                        <h3 class="m-3">Top 10 postos mais baratos</h3>
                        <div class="col-lg-12 col-sm-12 p-3">
                            <div style="position: relative; height: 400px; width: 100%;">
                                <canvas id="TotalPrecoRevenda2" style="width: 100%; height: 100%;"></canvas>
                            </div>
                        </div>   
                    </div>
                </div>                    
            </div>  
        </div>          

        <div class="col-lg-4 col-sm-12 col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title">Distribuição de Preços por Postos</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>Preço (R$)</th>
                                    <th>Quantidade de Postos</th>
                                    <th>Barra de Distribuição</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for preco in precos_por_postos %}
                                <tr>
                                    <td class="fw-bold">R$ {{ preco.preco_revenda|floatformat:2 }}</td>
                                    {% if preco.quantidade_postos == 1 %}
                                        <td>
                                            <span class="badge bg-light text-dark">{{ preco.quantidade_postos }}</span>
                                        </td>
                                    {% else %}
                                        <td>
                                            <span class="badge bg-primary">{{ preco.quantidade_postos }}</span>
                                        </td>
                                    {% endif %}
                                    <td>
                                        <div class="progress">
                                            {% widthratio preco.quantidade_postos total_postos 100 as percentage %}
                                            <div class="progress-bar bg-info" 
                                                 role="progressbar" 
                                                 aria-valuenow="{{ preco.quantidade_postos }}" 
                                                 aria-valuemin="0" 
                                                 aria-valuemax="{{ total_postos }}">
                                                {{ percentage }}%
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                {% empty %}
                                <tr>
                                    <td colspan="3" class="text-center text-muted">
                                        Nenhum dado disponível
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row d-flex justify-content-center">
        <div class="col-lg-8 col-sm-12 col-md-12">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title">Postos e seus Preços</h5>
                </div>
                <div class="card-body">
                    <div class="accordion" id="accordionPostos">
                        {% for posto in postos_com_precos %}
                        <div class="accordion-item">
                            <h2 class="accordion-header" id="heading{{ forloop.counter }}">
                                <button class="accordion-button collapsed" type="button" 
                                        data-bs-toggle="collapse" 
                                        data-bs-target="#collapse{{ forloop.counter }}" 
                                        aria-expanded="false" 
                                        aria-controls="collapse{{ forloop.counter }}">
                                    <div class="d-flex justify-content-between align-items-center w-100 me-3">
                                        <div class="d-flex flex-column">
                                            <span class="fw-bold">{{ posto.gasstation_id__razao|default:"N/A" }}</span>
                                            <small class="text-muted">{{ posto.gasstation_id__bandeira|default:"Sem bandeira" }}</small>
                                        </div>
                                        <div class="d-flex gap-2">
                                            <span class="badge bg-info">{{ posto.total_registros }} registros</span>
                                            <span class="badge bg-success">R$ {{ posto.preco_medio|floatformat:2 }}</span>
                                        </div>
                                    </div>
                                </button>
                            </h2>
                            <div id="collapse{{ forloop.counter }}" 
                                 class="accordion-collapse collapse" 
                                 aria-labelledby="heading{{ forloop.counter }}" 
                                 data-bs-parent="#accordionPostos">
                                <div class="accordion-body">
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <h6 class="text-muted">Informações do Posto</h6>
                                            <ul class="list-unstyled">
                                                <li><strong>Razão Social:</strong> {{ posto.gasstation_id__razao|default:"N/A" }}</li>
                                                <li><strong>Bandeira:</strong> {{ posto.gasstation_id__bandeira|default:"N/A" }}</li>
                                                <li><strong>Cidade:</strong> {{ posto.gasstation_id__cidade|default:"N/A" }}</li>
                                                <li><strong>Estado:</strong> {{ posto.gasstation_id__estado|default:"N/A" }}</li>
                                                <li><strong>Total de Registros:</strong> {{ posto.total_registros }}</li>
                                            </ul>
                                        </div>
                                        <div class="col-md-6">
                                            <h6 class="text-muted">Resumo de Preços</h6>
                                            <ul class="list-unstyled">
                                                <li><strong>Preço Mínimo:</strong> <span class="text-success">R$ {{ posto.preco_minimo|floatformat:2 }}</span></li>
                                                <li><strong>Preço Médio:</strong> <span class="text-primary">R$ {{ posto.preco_medio|floatformat:2 }}</span></li>
                                                <li><strong>Preço Máximo:</strong> <span class="text-danger">R$ {{ posto.preco_maximo|floatformat:2 }}</span></li>
                                                <li><strong>Período:</strong> {{ posto.data_primeira|date:'d/m/Y' }} a {{ posto.data_ultima|date:'d/m/Y' }}</li>
                                            </ul>
                                        </div>
                                    </div>
                                    
                                    <div class="mt-3">
                                        <h6 class="text-muted">Histórico de Preços</h6>
                                        <div class="table-responsive">
                                            <table class="table table-sm table-striped">
                                                <thead>
                                                    <tr>
                                                        <th>Preço (R$)</th>
                                                        <th>Quantidade de Dias</th>
                                                        <th>Período</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {% for preco in posto.precos_distintos %}
                                                    <tr>
                                                        <td class="fw-bold">R$ {{ preco.preco_revenda|floatformat:2 }}</td>
                                                        <td>
                                                            <span class="badge bg-secondary">{{ preco.quantidade_dias }} dias</span>
                                                        </td>
                                                        <td>
                                                            {% if preco.data_inicio == preco.data_fim %}
                                                                {{ preco.data_inicio|date:'d/m/Y' }}
                                                            {% else %}
                                                                {{ preco.data_inicio|date:'d/m/Y' }} a {{ preco.data_fim|date:'d/m/Y' }}
                                                            {% endif %}
                                                        </td>
                                                    </tr>
                                                    {% empty %}
                                                    <tr>
                                                        <td colspan="3" class="text-center text-muted">
                                                            Nenhum preço registrado
                                                        </td>
                                                    </tr>
                                                    {% endfor %}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        {% empty %}
                        <div class="text-center text-muted py-4">
                            <i class="fas fa-info-circle fa-2x mb-3"></i>
                            <p>Nenhum posto encontrado</p>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>

</section>

<!-- Passar dados do Django para JavaScript de forma segura -->
{{ preco_medio_mensal|json_script:"preco-medio-mensal-data" }}
{{ top_10_postos_mais_baratos|json_script:"top-10-postos-data" }}

<script>
    // Função para carregar dados do json_script
    function getDataFromScript(elementId) {
        const element = document.getElementById(elementId);
        if (element) {
            try {
                const data = JSON.parse(element.textContent);
                console.log(`Dados carregados de ${elementId}:`, data);
                return data;
            } catch (e) {
                console.error(`Erro ao parsear dados de ${elementId}:`, e);
                return null;
            }
        }
        console.warn(`Elemento ${elementId} não encontrado`);
        return null;
    }

    // Função para criar gráfico de preço médio mensal
    function criarGraficoPrecoMedioMensal() {
        try {
            console.log('Iniciando criação do gráfico Preço Médio Mensal...');
            
            const canvas = document.getElementById('TotalPrecoRevenda');
            if (!canvas) {
                console.error('Canvas TotalPrecoRevenda não encontrado');
                return;
            }

            const dados = getDataFromScript('preco-medio-mensal-data');
            if (!dados || dados.length === 0) {
                console.log('Nenhum dado de preço médio mensal disponível');
                // Criar gráfico vazio ou com dados fictícios
                const ctx = canvas.getContext('2d');
                if (window.precoMedioChart) {
                    window.precoMedioChart.destroy();
                }
                
                window.precoMedioChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Sem dados'],
                        datasets: [{
                            label: 'Preço de Revenda (R$)',
                            data: [0],
                            backgroundColor: 'rgba(200, 200, 200, 0.8)',
                            borderColor: 'rgba(200, 200, 200, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: true, position: 'top' },
                            tooltip: { enabled: true }
                        },
                        scales: {
                            y: { beginAtZero: true },
                            x: { title: { display: true, text: 'Mês' } }
                        }
                    }
                });
                return;
            }

            console.log('Dados carregados:', dados);

            const labels = dados.map(item => `${item.mes}/${item.ano}`);
            const valores = dados.map(item => parseFloat(item.preco_medio || 0));

            const ctx = canvas.getContext('2d');
            
            // Destruir gráfico existente se houver
            if (window.precoMedioChart) {
                window.precoMedioChart.destroy();
            }
            
            window.precoMedioChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Preço de Revenda (R$)',
                        data: valores,
                        backgroundColor: 'rgba(54, 162, 235, 0.8)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return 'Preço: R$ ' + context.parsed.y.toFixed(2);
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Preço (R$)'
                            },
                            ticks: {
                                callback: function(value) {
                                    return 'R$ ' + value.toFixed(2);
                                }
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Mês'
                            }
                        }
                    },
                    animation: {
                        duration: 1000
                    }
                }
            });
            
            console.log('Gráfico Preço Médio Mensal criado com sucesso');
        } catch (error) {
            console.error('Erro ao criar gráfico Preço Médio Mensal:', error);
        }
    }

    // Função para criar gráfico dos top 10 postos mais baratos
    function criarGraficoTop10Baratos() {
        try {
            console.log('Iniciando criação do gráfico Top 10 Postos Mais Baratos...');
            
            const canvas = document.getElementById('TotalPrecoRevenda2');
            if (!canvas) {
                console.error('Canvas TotalPrecoRevenda2 não encontrado');
                return;
            }

            const dados = getDataFromScript('top-10-postos-data');
            if (!dados || dados.length === 0) {
                console.log('Nenhum dado de posto disponível');
                // Criar gráfico vazio ou com dados fictícios
                const ctx = canvas.getContext('2d');
                if (window.top10BaratosChart) {
                    window.top10BaratosChart.destroy();
                }
                
                window.top10BaratosChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Sem dados'],
                        datasets: [{
                            label: 'Preço de Revenda (R$)',
                            data: [0],
                            backgroundColor: 'rgba(200, 200, 200, 0.8)',
                            borderColor: 'rgba(200, 200, 200, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { beginAtZero: true },
                            y: { title: { display: true, text: 'Postos' } }
                        }
                    }
                });
                return;
            }

            console.log('Dados carregados:', dados);

            const labels = dados.map(posto => posto.gasstation_id__razao || `Posto ${posto.gasstation_id__id || 'N/A'}`);
            const valores = dados.map(posto => parseFloat(posto.preco_medio || 0));

            const cores = [
                'rgba(255, 99, 132, 0.8)', 'rgba(54, 162, 235, 0.8)', 'rgba(255, 206, 86, 0.8)',
                'rgba(75, 192, 192, 0.8)', 'rgba(153, 102, 255, 0.8)', 'rgba(255, 159, 64, 0.8)',
                'rgba(199, 199, 199, 0.8)', 'rgba(83, 102, 255, 0.8)', 'rgba(78, 252, 3, 0.8)',
                'rgba(252, 3, 244, 0.8)'
            ];

            const ctx = canvas.getContext('2d');
            
            // Destruir gráfico existente se houver
            if (window.top10BaratosChart) {
                window.top10BaratosChart.destroy();
            }
            
            window.top10BaratosChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Preço de Revenda (R$)',
                        data: valores,
                        backgroundColor: cores.slice(0, dados.length),
                        borderColor: cores.slice(0, dados.length).map(cor => cor.replace('0.8', '1')),
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return 'Preço: R$ ' + context.parsed.x.toFixed(2);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            title: { display: true, text: 'Preço (R$)' },
                            ticks: {
                                callback: function(value) {
                                    return 'R$ ' + value.toFixed(2);
                                }
                            }
                        },
                        y: { 
                            title: { display: true, text: 'Postos' },
                            ticks: {
                                maxRotation: 0,
                                minRotation: 0
                            }
                        }
                    },
                    animation: { duration: 1000 }
                }
            });
            
            console.log('Gráfico Top 10 Postos Mais Baratos criado com sucesso');
        } catch (error) {
            console.error('Erro ao criar gráfico Top 10 Postos Mais Baratos:', error);
        }
    }

    // Função para carregar todos os gráficos
    function carregarGraficos() {
        if (typeof Chart !== 'undefined') {
            console.log('Chart.js disponível, carregando gráficos...');
            criarGraficoPrecoMedioMensal();
            criarGraficoTop10Baratos();
        } else {
            console.log('Chart.js não disponível, tentando novamente em 100ms...');
            setTimeout(carregarGraficos, 100);
        }
    }

    // Carregar gráficos quando DOM estiver pronto
    document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM carregado, iniciando gráficos...');
        carregarGraficos();
    });

    // Fallback: tentar carregar após um pequeno delay
    setTimeout(function() {
        console.log('Fallback: verificando se pode carregar os gráficos...');
        carregarGraficos();
    }, 1000);

    // Função para configurar progress bars
    function configurarProgressBars() {
        const progressBars = document.querySelectorAll('.progress-bar');
        progressBars.forEach(function(bar) {
            const percentage = bar.textContent.replace('%', '');
            if (percentage && !isNaN(percentage)) {
                bar.style.width = percentage + '%';
            }
        });
    }

    // Configurar progress bars quando DOM estiver pronto
    document.addEventListener('DOMContentLoaded', function() {
        configurarProgressBars();
    });
</script>
