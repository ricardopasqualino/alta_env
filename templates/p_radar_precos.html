{% extends 'base.html' %}

{% load static %}

{% block main %}



  <main id="main" class="main">

    <div class="pagetitle">
      <h1>Radar de Preços</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="{% url 'index' %}">Home</a></li>
          <li class="breadcrumb-item active">Radar de preços</li>
        </ol>
      </nav>
    </div>

    <section>
      <div class="row">
        <div class="col-lg-12">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Radar de Preços</h5>
              <div class="col-lg-12 col-sm-12 p-3">
                <div style="position: relative; height: 400px; width: 100%;">
                    <canvas id="RadarPreco" style="width: 100%; height: 100%;"></canvas>
                </div>
            </div>                 
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
       // Função para criar gráfico de preço médio mensal
       function criarGraficoPrecoMedioMensal() {
        try {
            console.log('Iniciando criação do gráfico Preço Médio Mensal...');
            
            const canvas = document.getElementById('RadarPreco');
            if (!canvas) {
                console.error('Canvas RadarPreco não encontrado');
                return;
            }

            const dados = getDataFromScript('preco-medio-mensal-data');
            if (!dados || dados.length === 0) {
                console.log('Nenhum dado de preço médio mensal disponível');
                // Criar gráfico vazio ou com dados fictícios
                const ctx = canvas.getContext('2d');
                if (window.precoMedioChart) {
                    window.precoMedioChart.destroy();
                }
                
                window.precoMedioChart = new Chart(ctx, {
                    type: 's',
                    data: {
                        labels: ['Sem dados'],
                        datasets: [{
                            label: 'Preço de Revenda (R$)',
                            data: [0],
                            backgroundColor: 'rgba(200, 200, 200, 0.8)',
                            borderColor: 'rgba(200, 200, 200, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: true, position: 'top' },
                            tooltip: { enabled: true }
                        },
                        scales: {
                            y: { beginAtZero: true },
                            x: { title: { display: true, text: 'Mês' } }
                        }
                    }
                });
                return;
            }

  </script>


{% endblock %}
