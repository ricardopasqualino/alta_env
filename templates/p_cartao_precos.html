{% extends 'base.html' %}

{% load static %}

{% block title %}Cartão de Preços - ALTA VIEW{% endblock %}

{% block main %}
<style>
  .cidade-select-container .select2-container {
      width: 300px;
  }
</style>

  <main id="main" class="main">
    <div class="pagetitle">
      <h1>Cartão de Preços</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="{% url 'index' %}">Home</a></li>
          <li class="breadcrumb-item active">Cartão de preços</li>
        </ol>
      </nav>
    </div>  

    <section>
      <div class="row">
          <form method="GET">
            <div class="row align-items-end">
              <div class="col-lg-4 mt-3">

                <div class="form-group">
                  <label class="mb-2" for="cidadeSelect">Escolha a cidade:</label>
                  <select class="form-select" id="searchDropdown" name="cidade" aria-label="Cidade" 
                  aria-describedby="basic-addon1" required="required"
                    {{ fil.form.cidade }} </>
                </div>

              </div>

              <div class="col-lg-2 mt-3">
                <div class="form-group">
                  <label class="mb-2" for="mesSelect">Escolha o mês:</label>
                  <select class="form-select" id="mesSelect" name="mes"
                    {{ fil.form.mes }} </>
                </div>
              </div>

              <div class="col-lg-2 mt-3">
                <div class="form-group">
                  <label class="mb-2" for="anoSelect">Escolha o ano:</label>
                  <select class="form-select" id="anoSelect" name="ano"
                    {{ fil.form.ano }} </>
                </div>
              </div>
      
              <div class="col-lg-3 mt-3">
                <button class="btn btn-primary" type="submit">Enviar</button>
                <a href="{% url 'p_cartao_precos' %}" class="btn btn-outline-primary">Limpar</a>
              </div>

            </div>
          </form>
      </div>
    </section>

    <section>
      <div class="col-lg-12 mt-3">
        <div class="row align-items-center">
          {% if not cidade %}
          <div class="row">
            <div class="col-lg-12 col-md-12 col-sm-9">
              <h1 class="card-title text-left mt-3 fs-2">Preços atualizados de postos em todo o Brasil!</h1>
              <p class="mt-2">Escolha uma cidade e comece a mapear sua região.</p>
            </div>
          </div>
          {% else %}
          
          <div class="row d-flex">
            <p class="justify-align-left text-align-left">Última atualização em {{ ultima_data|date:'d/m/Y' }}</p>
          </div>   

          <div class="col-lg-4 mt-3">
            <h1 class="p-2 card-title mb-3">Preço Mínimo</h1>
              <div class="card">
                <div class="card-body">
                  <div class="list-group mt-3">
                  {% for item in preco_min %}
                    <button type="button" class="list-group-item list-group-item-action" 
                            data-bs-toggle="modal" 
                            data-bs-target="#verticalycentered"
                            data-produto="{{ item.produto_id__produto }}">
                      {{ item.produto_id__produto }} - R$ {{ item.preco_minimo|floatformat:2 }}
                    </button>
                  {% empty %}
                    <p class="text-center">Nenhum preço mínimo encontrado para esta cidade.</p>
                  {% endfor %}
                  </div>
                </div>
              </div>
            </div>
                        
          <div class="col-lg-4 mt-3">
            <h1 class="p-2 card-title mb-3">Preço Médio</h1>
              <div class="card">
                <div class="card-body">
                  <div class="list-group mt-3">
                  {% for item in preco_avg %}
                    <button type="button" class="list-group-item list-group-item-action">
                      {{ item.produto_id__produto }} - R$ {{ item.preco_medio|floatformat:2 }}
                    </button>
                  {% empty %}
                    <p class="text-center">Nenhum preço médio encontrado para esta cidade.</p>
                  {% endfor %}
                  </div>
                </div>
              </div>
          </div>

          <div class="col-lg-4">
            <h1 class="p-2 card-title mb-3">Preço Máximo</h1>
              <div class="card">
                <div class="card-body">
                  <div class="list-group mt-3">
                  {% for item in preco_max %}
                    <button type="button" class="list-group-item list-group-item-action">
                      {{ item.produto_id__produto }} - R$ {{ item.preco_maximo|floatformat:2 }}
                    </button>
                  {% empty %}
                    <p class="text-center">Nenhum preço máximo encontrado para esta cidade.</p>
                  {% endfor %}
                  </div>
                </div>
              </div>
            </div>
        </div>
      </div>   
      {% endif %}
    </section>

   <!-- Script -->
  <script>
      $(function () {
      $('[data-toggle="tooltip"]').tooltip()
      })
  </script>

  <script>
    // Adicionar o evento de formatação quando o modal for mostrado
    const modal = document.getElementById('verticalycentered');
    modal.addEventListener('shown.bs.modal', function () {
        // Selecionar todos os campos de input com a classe "priceInput"
        const priceInputs = document.querySelectorAll('.priceInput');

        priceInputs.forEach(priceInput => {
            priceInput.addEventListener('input', function (e) {
                let value = e.target.value.replace(/\D/g, ''); // Remove tudo que não for dígito
                
                // Limitar a 4 dígitos no total
                if (value.length > 4) {
                    value = value.substring(0, 4);
                }

                // Inserir o ponto automaticamente para as últimas 2 casas decimais
                if (value.length > 2) {
                    value = value.slice(0, value.length - 2) + '.' + value.slice(value.length - 2);
                } else if (value.length === 2) {
                    value = '' + value; // Se tiver apenas 2 dígitos, exibir 0.XX
                } else if (value.length === 1) {
                    value = '' + value; // Se tiver apenas 1 dígito, exibir 0.0X
                }

                e.target.value = value;
            });
        });
    });
  </script>

<script>
  $(document).ready(function() {
      $('#searchDropdown').select2({
          placeholder: 'Digite para buscar...',
          allowClear: true,
          language: {
              noResults: function() {
                  return "Nenhum resultado encontrado";
              },
              searching: function() {
                  return "Buscando...";
              }
          },
          matcher: function(params, data) {
              // Se não há termo de busca, retorna todos os dados
              if ($.trim(params.term) === '') {
                  return data;
              }

              // Verifica se o texto corresponde usando regex
              try {
                  const regex = new RegExp(params.term, 'i');
                  if (regex.test(data.text)) {
                      return data;
                  }
              } catch (e) {
                  // Se regex inválido, faz busca simples
                  if (data.text.toLowerCase().indexOf(params.term.toLowerCase()) > -1) {
                      return data;
                  }
              }

              // Retorna null se não encontrar correspondência
              return null;
          }
      });
  });
</script>  


<style>
  /* Estilos para o select2 ficar igual ao campo empresa */
.select2-container--default .select2-selection--single {
  height: 38px;
  border: 1px solid #ced4da;
  border-radius: 0.375rem;
  background-color: #fff;
  padding: 0.375rem 0.75rem;
  font-size: 1rem;
  line-height: 1.5;
  color: #212529;
  transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
}

.select2-container--default .select2-selection--single:focus {
  border-color: #86b7fe;
  outline: 0;
  box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
}

.select2-container--default .select2-selection--single .select2-selection__rendered {
  line-height: 24px;
  padding-left: 0;
  color: #212529;
}

.select2-container--default .select2-selection--single .select2-selection__placeholder {
  color: #6c757d;
}

.select2-container--default .select2-selection--single .select2-selection__arrow {
  height: 36px;
  right: 8px;
}

.select2-container--default .select2-dropdown {
  border: 1px solid #ced4da;
  border-radius: 0.375rem;
  box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
}

.select2-container--default .select2-search--dropdown .select2-search__field {
  border: 1px solid #ced4da;
  border-radius: 0.375rem;
  padding: 0.375rem 0.75rem;
}

.select2-container--default .select2-results__option--highlighted[aria-selected] {
  background-color: #0d6efd;
}

/* Cor do hover quando uma opção está selecionada */
.select2-container--default .select2-results__option[aria-selected=true]:hover {
  background-color: #0d6efd;
}

.select2-container--default .select2-results__option[aria-selected=true] {
  background-color: #e9ecef;
  color: #000;
}

/* Garantir que o select2 tenha a mesma largura e comportamento do campo empresa */
.select2-container {
  width: 100% !important;
}

.select2-container--default .select2-selection--single {
  width: 100%;
  box-sizing: border-box;
}

/* Remover bordas duplas quando o select2 está focado */
.select2-container--default.select2-container--focus .select2-selection--single {
  border-color: #86b7fe;
  outline: 0;
  box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
}

/* Garantir que o dropdown apareça corretamente */
.select2-dropdown {
  z-index: 9999;
}
</style>

<script>
  $(document).ready(function() {
      $('#searchDropdown').select2({
          placeholder: 'Digite para buscar...',
          allowClear: true,
          width: '100%',
          dropdownParent: $('body'),
          language: {
              noResults: function() {
                  return "Nenhum resultado encontrado";
              },
              searching: function() {
                  return "Buscando...";
              }
          },
          matcher: function(params, data) {
              // Se não há termo de busca, retorna todos os dados
              if ($.trim(params.term) === '') {
                  return data;
              }

              // Verifica se o texto corresponde usando regex
              try {
                  const regex = new RegExp(params.term, 'i');
                  if (regex.test(data.text)) {
                      return data;
                  }
              } catch (e) {
                  // Se regex inválido, faz busca simples
                  if (data.text.toLowerCase().indexOf(params.term.toLowerCase()) > -1) {
                      return data;
                  }
              }

              // Retorna null se não encontrar correspondência
              return null;
          }
      });
  });
</script>  



</main>
{% endblock %}
